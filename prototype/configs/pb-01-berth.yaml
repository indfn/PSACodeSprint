# PB-01: Berth Delay Cascade
# Reassign berths when vessel arrives late, minimise DTQC idle time

problem:
  id: PB-01
  name: "Berth Delay Cascade"
  sector: "Berth & Marine"
  description: "Reassign berths when vessel arrives late, minimise DTQC idle time"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  fallback_provider: openai
  fallback_model: gpt-4o

systems:
  - name: vtis
    type: vessel_traffic
    capabilities: [vessel_arrival, pilot_availability, tug_availability]
  - name: optevoyage
    type: voyage_planning
    capabilities: [berth_booking, draft_restrictions, tidal_windows]
  - name: citos_ppt
    type: terminal_os
    capabilities: [berth_occupancy, qc_status, yard_capacity]

tools:
  - name: query_vessel_arrival
    systems: [vtis]
    tool_id: tool_1
  - name: check_berth_availability
    systems: [optevoyage, citos_ppt]
    tool_id: tool_2
  - name: check_qc_availability
    systems: [citos_ppt]
    tool_id: tool_3
  - name: compute_berth_reassignment
    systems: []
    tool_id: tool_4
  - name: notify_vessel_operator
    systems: [vtis]
    tool_id: tool_5

hitl_gates:
  - gate_id: hitl_1
    trigger: reassignment_computed
    action: require_approval
    label: "Approve Berth Reassignment"
    timeout_minutes: 30
  - gate_id: hitl_2
    trigger: qc_reallocation_ready
    action: require_approval
    label: "Approve QC Reallocation"
    timeout_minutes: 15

cost_params:
  vessel_demurrage_per_hr: 2500
  berth_idle_cost_per_hr: 500
  qc_repositioning_cost: 2000
  pilot_standby_per_hr: 300
  tidal_window_miss_cost: 5000

constraints:
  max_berths: 56
  min_qc_per_berth: 2
  max_qc_per_berth: 4
  tidal_windows: ["spring", "neap"]
  berth_draft_limits: {A: 16.5, B: 15.0, C: 14.0}
