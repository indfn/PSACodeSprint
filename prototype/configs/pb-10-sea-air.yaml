# PB-10: Sea-Air Cut-Off Breach
# Decide modal shift when sea cut-off is missed for air cargo handover

problem:
  id: PB-10
  name: "Sea-Air Cut-Off Breach"
  sector: "Multimodal Logistics"
  description: "Decide modal shift when sea cut-off is missed for air cargo handover"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  fallback_provider: openai
  fallback_model: gpt-4o

systems:
  - name: optemodal
    type: modal_planning
    capabilities: [modal_selection, cost_comparison, schedule_integration]
  - name: tradenet
    type: trade_document
    capabilities: [customs_declaration, document_status]
  - name: sats
    type: ground_handling
    capabilities: [air_cargo_availability, handling_capacity]

tools:
  - name: query_cargo_status
    systems: [optemodal]
    tool_id: tool_1
  - name: check_air_availability
    systems: [sats]
    tool_id: tool_2
  - name: compute_modal_shift
    systems: []
    tool_id: tool_3
  - name: expedite_customs
    systems: [tradenet]
    tool_id: tool_4
  - name: notify_shipper
    systems: [optemodal]
    tool_id: tool_5

hitl_gates:
  - gate_id: hitl_1
    trigger: modal_shift_computed
    action: require_approval
    label: "Approve Modal Shift"
    timeout_minutes: 30

cost_params:
  air_freight_per_kg: 4.50
  sea_freight_per_teu: 800
  cut_off_breach_penalty: 2000
  storage_per_day: 60
  customs_expediting: 500

constraints:
  max_air_capacity_kg: 50000
  air_cut_off_hours: 6
  sea_cut_off_hours: 2
  customs_processing_min: 45
