# PB-09: Expressway Disruption Gridlock
# Reroute trucks when AYE/ECP is blocked, reallocate time slots

problem:
  id: PB-09
  name: "Expressway Disruption Gridlock"
  sector: "Gate & External Haulage"
  description: "Reroute trucks when AYE/ECP is blocked, reallocate time slots"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  fallback_provider: openai
  fallback_model: gpt-4o

systems:
  - name: optetruck
    type: transport
    capabilities: [truck_tracking, route_optimisation, gate_booking]
  - name: smartbooking
    type: gate_booking
    capabilities: [time_slot_management, gate_capacity]
  - name: ibox
    type: gate_system
    capabilities: [truck_arrival, container_verification]

tools:
  - name: query_traffic_status
    systems: [optetruck]
    tool_id: tool_1
  - name: check_alternate_routes
    systems: [optetruck]
    tool_id: tool_2
  - name: compute_reroute_plan
    systems: []
    tool_id: tool_3
  - name: reallocate_time_slots
    systems: [smartbooking]
    tool_id: tool_4
  - name: notify_gate_operations
    systems: [ibox]
    tool_id: tool_5

hitl_gates:
  - gate_id: hitl_1
    trigger: reroute_computed
    action: require_approval
    label: "Approve Truck Reroute"
    timeout_minutes: 15

cost_params:
  truck_delay_per_hr: 50
  slot_waste_cost: 100
  fuel_detour_per_trip: 30
  driver_overtime_per_hr: 75
  gate_congestion_per_hr: 200

constraints:
  max_detour_time_min: 30
  alternate_routes: ["TPE", "BKE", "PIE"]
  max_simultaneous_trucks: 20
  slot_realloc_window_min: 60
