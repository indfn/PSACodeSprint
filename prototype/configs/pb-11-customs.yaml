# PB-11: Customs Hold Gridlock
# Prioritise document acceleration when multiple containers are held by customs

problem:
  id: PB-11
  name: "Customs Hold Gridlock"
  sector: "Multimodal Logistics"
  description: "Prioritise document acceleration when multiple containers are held by customs"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  fallback_provider: openai
  fallback_model: gpt-4o

systems:
  - name: tradenet
    type: trade_document
    capabilities: [customs_declaration, document_status, hold_management]
  - name: calista
    type: trade_compliance
    capabilities: [document_verification, compliance_check]
  - name: portnet
    type: community
    capabilities: [container_tracking, notification]

tools:
  - name: query_customs_hold
    systems: [tradenet]
    tool_id: tool_1
  - name: check_document_status
    systems: [calista]
    tool_id: tool_2
  - name: compute_priority_sequence
    systems: []
    tool_id: tool_3
  - name: expedite_documents
    systems: [tradenet]
    tool_id: tool_4
  - name: notify_consignee
    systems: [portnet]
    tool_id: tool_5

hitl_gates:
  - gate_id: hitl_1
    trigger: priority_computed
    action: require_approval
    label: "Approve Document Prioritisation"
    timeout_minutes: 30

cost_params:
  storage_per_day: 45
  demurrage_per_container_per_day: 100
  document_expediting_cost: 200
  staff_overtime_per_hr: 75
  reputation_cost_per_delay: 500

constraints:
  max_held_containers: 30
  customs_processing_hours: 8
  document_types: ["BL", "CO", "invoice", "packing_list"]
  expedite_available: true
