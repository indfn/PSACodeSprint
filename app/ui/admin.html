<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSA NEXUS — Admin Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <div class="admin-container">
      <div class="admin-header">
        <h1>PSA <span class="accent">NEXUS</span></h1>
        <p>Admin Console</p>
      </div>

      <div class="admin-body">
        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
          <div class="admin-error" id="login-error" role="alert"></div>
          <div class="admin-field">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" autocomplete="off" required>
          </div>
          <div class="admin-field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="off" required>
          </div>
          <button type="submit" class="btn-login" id="btn-login">LOGIN</button>
        </form>

        <!-- Config Panel (post-login) -->
        <div class="admin-config" id="admin-config">
          <div class="admin-header-row">
            <div class="admin-section-title" style="border:none;margin:0;padding:0">Configuration</div>
            <button class="admin-logout" id="btn-logout">LOGOUT</button>
          </div>

          <!-- Provider Readiness -->
          <div class="admin-section">
            <div class="admin-section-title">Provider Readiness</div>
            <div class="admin-readiness" id="readiness-display">
              <div class="admin-readiness-dot not-ready" id="readiness-dot"></div>
              <span class="admin-readiness-text" id="readiness-text">Checking...</span>
            </div>
          </div>

          <!-- API Key Injection -->
          <div class="admin-section">
            <div class="admin-section-title">API Key Injection</div>
            <div class="admin-apikey-form">
              <div class="admin-field">
                <label for="apikey-provider">Provider</label>
                <input type="text" id="apikey-provider" placeholder="anthropic, openai, gemini, deepseek">
              </div>
              <div class="admin-field">
                <label for="apikey-key">API Key</label>
                <input type="password" id="apikey-key" placeholder="sk-...">
              </div>
            </div>
            <button class="btn-inject" id="btn-inject-key" style="margin-top:var(--sp-3)">INJECT KEY</button>
            <div class="admin-success" id="apikey-success"></div>
          </div>

          <!-- Current Config Display -->
          <div class="admin-section">
            <div class="admin-section-title">Current LLM Config</div>
            <div id="config-display" class="sidebar-status" style="white-space:pre-wrap">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
