<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSA Nexus — Admin Config</title>
  <link rel="stylesheet" href="/ui/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body style="min-height:100dvh;background:#020617;color:#F8FAFC;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased">
  <div style="position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0.04;background:radial-gradient(600px 600px at 20% 10%, #22C55E 0%, transparent 60%),radial-gradient(800px 800px at 90% 30%, #0EA5E9 0%, transparent 60%)" aria-hidden="true"></div>

  <div style="max-width:800px;margin:0 auto;padding:24px 16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">
      <span style="height:8px;width:8px;border-radius:50%;background:#22C55E;display:inline-block"></span>
      <h1 style="font-size:18px;font-weight:600;letter-spacing:-0.02em">PSA Nexus — Admin</h1>
      <a href="/ui/" style="margin-left:auto;font-size:12px;color:#94A3B8;text-decoration:none;border:1px solid rgba(255,255,255,0.1);padding:6px 12px;border-radius:9999px">Back to Dashboard</a>
    </div>

    <div id="login-screen" style="max-width:380px;margin:40px auto;padding:24px;border-radius:1.5rem;background:#0F172A;border:1px solid rgba(255,255,255,0.1)">
      <h2 style="font-size:16px;font-weight:600;letter-spacing:-0.02em;margin-bottom:16px;display:flex;align-items:center;gap:8px"><i class="ph ph-lock" style="color:#94A3B8"></i> Admin Login</h2>
      <input id="login-user" type="text" placeholder="Username" autocomplete="username" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-bottom:12px" />
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-bottom:16px" />
      <button id="login-btn" style="width:100%;border-radius:9999px;background:#22C55E;padding:10px 16px;font-size:13px;font-weight:500;color:#020617;border:none;cursor:pointer">Login</button>
      <div id="login-error" style="margin-top:12px;font-size:13px;color:#FCA5A5;display:none"></div>
    </div>

    <div id="config-screen" style="display:none;flex-direction:column;gap:20px">

      <section style="border-radius:1.5rem;background:#0F172A;border:1px solid rgba(255,255,255,0.1);padding:20px;display:flex;flex-direction:column;gap:16px">
        <h2 style="font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:#94A3B8">Global LLM Provider</h2>
        <div id="readiness-banner" style="display:none;border-radius:10px;padding:10px 14px;font-size:12px"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <label style="font-size:11px;color:#94A3B8">Provider</label>
            <select id="cfg-provider" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px">
              <option value="anthropic">Anthropic</option><option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option><option value="deepseek">DeepSeek</option>
              <option value="ollama">Ollama (local)</option><option value="vllm">vLLM (local)</option>
              <option value="lmstudio">LM Studio (local)</option><option value="custom">Custom</option>
            </select>
          </div>
          <div><label style="font-size:11px;color:#94A3B8">Model</label><input id="cfg-model" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px" /></div>
          <div><label style="font-size:11px;color:#94A3B8">Base URL</label><input id="cfg-base-url" placeholder="(optional)" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px" /></div>
          <div>
            <label style="font-size:11px;color:#94A3B8">API Type</label>
            <select id="cfg-api-type" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px">
              <option value="openai">OpenAI-compatible</option><option value="anthropic">Anthropic-compatible</option><option value="google">Google / Gemini</option>
            </select>
          </div>
          <div><label style="font-size:11px;color:#94A3B8">Confidence Threshold</label><input id="cfg-threshold" type="number" step="0.01" min="0" max="1" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px" /></div>
          <div><label style="font-size:11px;color:#94A3B8">Fallback Model</label><input id="cfg-fallback-model" placeholder="(optional)" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px" /></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button id="cfg-save" style="border-radius:9999px;background:#22C55E;padding:8px 20px;font-size:13px;font-weight:500;color:#020617;border:none;cursor:pointer">Save</button>
          <span id="cfg-status" style="font-size:12px;color:#94A3B8"></span>
        </div>
      </section>

      <section style="border-radius:1.5rem;background:#0F172A;border:1px solid rgba(255,255,255,0.1);padding:20px;display:flex;flex-direction:column;gap:16px">
        <h2 style="font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:#94A3B8">API Key Injection</h2>
        <p style="font-size:11px;color:#64748B">Keys are write-only — never displayed after injection. Stored in <span style="font-family:'JetBrains Mono',monospace">.env</span> + <span style="font-family:'JetBrains Mono',monospace">os.environ</span>.</p>
        <div id="api-key-status" style="font-size:11px;color:#94A3B8;font-family:'JetBrains Mono',monospace;display:flex;gap:12px;flex-wrap:wrap"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <label style="font-size:11px;color:#94A3B8">Provider</label>
            <select id="key-provider" style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px">
              <option value="anthropic">Anthropic</option><option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option><option value="deepseek">DeepSeek</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div><label style="font-size:11px;color:#94A3B8">API Key</label><input id="key-value" type="password" placeholder="sk-..." style="width:100%;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 12px;font-size:13px;color:#F8FAFC;outline:none;margin-top:4px" /></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button id="key-inject" style="border-radius:9999px;background:#22C55E;padding:8px 20px;font-size:13px;font-weight:500;color:#020617;border:none;cursor:pointer">Inject Key</button>
          <span id="key-status" style="font-size:12px;color:#94A3B8"></span>
        </div>
      </section>

      <section style="border-radius:1.5rem;background:#0F172A;border:1px solid rgba(255,255,255,0.1);padding:20px;display:flex;flex-direction:column;gap:12px">
        <h2 style="font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:#94A3B8">Per-Problem Config</h2>
        <div id="problem-config-display" style="font-size:11px;color:#94A3B8;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;max-height:300px;overflow:auto"></div>
      </section>

    </div>
  </div>
  <script src="/ui/admin.js"></script>
</body>
</html>
