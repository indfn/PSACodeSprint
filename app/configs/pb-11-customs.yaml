problem:
  id: PB-11
  name: Customs Hold Gridlock
  sector: Multimodal Logistics
  description: Prioritise document acceleration when multiple containers are held
    by customs
systems:
- name: tradenet
  type: trade_document
  capabilities:
  - customs_declaration
  - document_status
  - hold_management
- name: calista
  type: trade_compliance
  capabilities:
  - document_verification
  - compliance_check
- name: portnet
  type: community
  capabilities:
  - container_tracking
  - notification
tools:
- name: query_customs_hold
  systems:
  - tradenet
  tool_id: tool_1
- name: check_document_status
  systems:
  - calista
  tool_id: tool_2
- name: compute_priority_sequence
  systems: []
  tool_id: tool_3
- name: expedite_documents
  systems:
  - tradenet
  tool_id: tool_4
- name: notify_consignee
  systems:
  - portnet
  tool_id: tool_5
hitl_gates:
- gate_id: hitl_1
  trigger: priority_computed
  action: require_approval
  label: Approve Document Prioritisation
  timeout_minutes: 30
  timeout_action: escalate_to_duty_manager
- gate_id: hitl_2
  trigger: document_expedite_ready
  action: require_approval
  label: Approve Document Expediting
  timeout_minutes: 15
  timeout_action: escalate_to_duty_manager
cost_params:
  storage_per_day: 45
  demurrage_per_container_per_day: 100
  document_expediting_cost: 200
  staff_overtime_per_hr: 75
  reputation_cost_per_delay: 500
constraints:
  max_held_containers: 30
  customs_processing_hours: 8
  document_types:
  - BL
  - CO
  - invoice
  - packing_list
  expedite_available: true
confidence:
  enabled: true
  threshold: 0.85
  method: llm_self_assessment
escalation_triggers:
- trigger_id: esc_1
  name: Low model confidence
  condition: confidence_score < 0.85
  threshold: 0.85
- trigger_id: esc_2
  name: Customs hold exceeds tolerance
  condition: customs_hold_hours > 1.5
  threshold: 1.5
- trigger_id: esc_3
  name: Financial recovery cost exceeds limit
  condition: recommended_action_cost > 10000
  threshold: 10000
- trigger_id: esc_4
  name: Data latency exceeds freshness window
  condition: max_data_age_min > 30
  threshold: 30
- trigger_id: esc_5
  name: Expediting capacity below threshold
  condition: available_expedite_slots < (required_slots * 0.6)
  threshold: 0.6
- trigger_id: esc_6
  name: Customs officer unresponsive
  condition: customs_response_time_min > 15
  threshold: 15
- trigger_id: esc_7
  name: Conflict between customs and logistics planners
  condition: planner_recommendations_conflict == true
  threshold: null
edge_cases:
- case_id: ec_1
  name: Bulk customs inspection
  inject_at_step: 3
  description: CALISTA reports 30 containers flagged for inspection - 15 high-priority,
    15 standard
  agent_response: Compute priority sequence (high-priority first), request re-approval
- case_id: ec_2
  name: TradeNet system outage
  inject_at_step: 2
  description: TradeNet reports system latency >25 min - document status stale
  agent_response: Trigger escalation, present stale-data alert
