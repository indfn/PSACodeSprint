# PB-04: Missed Feeder Connection
# Reroute containers when feeder misses connection at downstream port

problem:
  id: PB-04
  name: "Missed Feeder Connection"
  sector: "Multimodal Logistics"
  description: "Reroute containers when feeder misses connection at downstream port"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  fallback_provider: openai
  fallback_model: gpt-4o

systems:
  - name: portnet
    type: community
    capabilities: [feeder_schedule, reroute_options, container_tracking]
  - name: citos_ppt
    type: terminal_os
    capabilities: [container_location, customs_status]
  - name: citos_tuas
    type: terminal_os
    capabilities: [yard_blocks, vessel_schedule]

tools:
  - name: query_feeder_status
    systems: [portnet]
    tool_id: tool_1
  - name: check_reroute_options
    systems: [portnet, citos_ppt]
    tool_id: tool_2
  - name: compute_reroute_plan
    systems: []
    tool_id: tool_3
  - name: notify_consignee
    systems: [portnet]
    tool_id: tool_4
  - name: update_loading_sequence
    systems: [citos_tuas]
    tool_id: tool_5

hitl_gates:
  - gate_id: hitl_1
    trigger: reroute_computed
    action: require_approval
    label: "Approve Reroute Plan"
    timeout_minutes: 30

cost_params:
  missed_connection_per_container: 150
  reroute_cost_per_container: 200
  storage_per_day: 45
  downstream_demurrage_per_hr: 100
  sla_penalty_per_container: 250

constraints:
  max_reroute_containers: 60
  reroute_deadline_hours: 24
  available_reroute_vessels: 3
  priority_sla_containers: 20
